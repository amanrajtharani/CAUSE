  <g fill="#000000" font-family="Impact, 'Arial Black', 'Montserrat', -apple-system, sans-serif" font-weight="900">
    <text x="131" y="190" font-size="98" text-anchor="middle">A</text>
    <text x="211" y="190" font-size="98" text-anchor="middle">U</text>
    <text x="285" y="190" font-size="98" text-anchor="middle">S</text>
