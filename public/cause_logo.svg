<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="460" height="300" fill="none">
  <!-- Outer Golden Crescent -->
  <path
    d="M 168 38 
       C 240 12, 350 22, 412 78 
       C 458 120, 458 180, 412 222 
       C 350 278, 240 288, 168 262 
       C 230 252, 330 236, 368 188 
