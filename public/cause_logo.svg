  <line x1="75" y1="110.5" x2="385" y2="110.5" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="117" x2="385" y2="117" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="123.5" x2="385" y2="123.5" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="130" x2="385" y2="130" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="136.5" x2="385" y2="136.5" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="143" x2="385" y2="143" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="149.5" x2="385" y2="149.5" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="156" x2="385" y2="156" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="162.5" x2="385" y2="162.5" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="169" x2="385" y2="169" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="175.5" x2="385" y2="175.5" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="182" x2="385" y2="182" stroke="#CBD5E1" stroke-width="2.5" />
  <line x1="75" y1="188.5" x2="385" y2="188.5" stroke="#CBD5E1" stroke-width="2.5" />

  <!-- Giant Solid Black C -->
  <path
    d="M 188 38 
       L 131 38 
       A 112 112 0 0 0 131 262 
       L 188 262 
       L 188 204 
       L 131 204 
       A 54 54 0 0 1 131 96 
       L 188 96 
